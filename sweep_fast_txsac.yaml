program: train.py
method: grid
name: fast-hyperparameter-trends-txsac
metric:
  name: eval/success_rate
  goal: maximize

parameters:
  learning_rate:
    values: [1e-5, 5e-5, 1e-4]        # Tx-SAC needs lower LR
  batch_size:
    values: [128, 256]
  goal_reward:
    value: 500
  progress_weight:
    value: 5.0
  collision_penalty:
    value: 150
  hybrid:
    value: true                          # Tx-SAC with RRT guidance
  algorithm:
    value: tx-sac                        # ← USING YOUR ALGORITHM
  env_type:
    value: static
  total_timesteps:
    value: 100000
  num_envs:
    value: 12
  eval_freq:
    value: 10000
  seed:
    value: 42
  gpu:
    value: true
  wandb_project:
    value: tb3-nav-fast-trends-txsac
