# sweep_quick_validation.yaml – Validates reward function across seeds and architectures
# Runs 8 configurations in parallel on 4 GPUs (~30-40 minutes total)

program: train.py
method: grid
name: quick-validation
metric:
  name: eval/success_rate
  goal: maximize

parameters:
  # Fixed reward parameters (the ones we believe are good)
  goal_reward:
    value: 100
  collision_penalty:
    value: 50
  progress_weight:
    value: 2.0
  away_penalty:
    value: 3.0
  
  # Test both architectures
  hybrid:
    values: [true, false]
  
  # Test multiple seeds for reproducibility
  seed:
    values: [42, 123, 456, 789]
  
  # Fixed training parameters (small for quick test)
  env_type:
    value: static
  algorithm:
    value: sac
  total_timesteps:
    value: 30000
  num_envs:
    value: 4
  eval_freq:
    value: 5000
  
  gpu:
    value: true
  
  wandb_project:
    value: tb3-nav-quick-validation
  wandb_mode:
    value: online
