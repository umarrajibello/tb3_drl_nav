# sweep_reward.yaml – Bayesian hyperparameter sweep for reward function
# Usage:
#   wandb sweep sweep_reward.yaml --project tb3-nav-research
#   wandb agent <sweep_id>

program: train.py
method: bayes          # can also use 'random' or 'grid'
metric:
  name: eval/mean_reward
  goal: maximize

parameters:
  # ---- Environment & algorithm (fixed) ----
  env_type:
    value: mixed
  hybrid:
    value: true
  algorithm:
    value: sac          # you can change to ppo, lstm-sac, etc.
  total_timesteps:
    value: 300000       # shorter for sweeps (still enough to see effect)
  seed:
    value: 42
  
  # ---- Reward parameters (tunable) ----
  goal_reward:
    min: 10.0
    max: 40.0
  collision_penalty:
    min: 5.0
    max: 25.0
  progress_weight:
    min: 2.0
    max: 10.0
  ttc_weight:
    min: 0.5
    max: 3.0
  safety_dist_weight:
    min: 0.2
    max: 1.5
  angular_penalty:
    min: 0.01
    max: 0.1
  step_penalty:
    min: 0.01
    max: 0.05
  idle_penalty:
    min: 0.02
    max: 0.1

  # ---- Optional: also sweep learning rate? ----
  # learning_rate:
  #   min: 1e-5
  #   max: 5e-4
  #   distribution: log_uniform
