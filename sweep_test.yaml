# sweep_test.yaml – QUICK TEST (30 minutes total)
# Tests only 2 configurations to verify everything works

program: train.py
method: grid
name: quick-test
metric:
  name: eval/success_rate
  goal: maximize

parameters:
  goal_reward:
    values: [100]              # Just 1 value for quick test
  collision_penalty:
    value: 50
  progress_weight:
    value: 2.0
  away_penalty:
    value: 3.0
  
  env_type:
    value: static
  algorithm:
    value: sac
  hybrid:
    values: [true, false]      # Test both hybrid and end-to-end
  
  total_timesteps:
    value: 30000               # Small! 30k steps each
  num_envs:
    value: 4
  eval_freq:
    value: 5000
  seed:
    value: 42                  # Just 1 seed for quick test
  
  gpu:
    value: true
  
  wandb_project:
    value: tb3-nav-quick-test
  wandb_mode:
    value: online
