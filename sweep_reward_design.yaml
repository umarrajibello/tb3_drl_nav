program: train.py
method: grid
name: hybrid-reward-sweep-fast
metric:
  name: eval/success_rate
  goal: maximize

parameters:
  goal_reward:
    values: [500, 1000]
  progress_weight:
    values: [3.0, 5.0]
  hybrid:
    values: [true, false]
  
  # Only these are supported by train.py
  collision_penalty:
    value: 150
  
  # Environment
  algorithm:
    value: sac
  env_type:
    value: static
  total_timesteps:
    value: 500000
  num_envs:
    value: 12
  eval_freq:
    value: 10000
  seed:
    value: 42
  gpu:
    value: true
  
  wandb_project:
    value: tb3-nav-reward-design-sweep-fast
